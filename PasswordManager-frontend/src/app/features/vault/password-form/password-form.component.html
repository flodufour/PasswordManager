<div class="modal-backdrop" (click)="cancelled.emit()"></div>

<div class="modal">
  <div class="modal-header">
    <h2>{{ isEdit ? 'Edit password' : 'Add password' }}</h2>
    <button class="modal-close" (click)="cancelled.emit()">✕</button>
  </div>

  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (error()) {
      <div class="alert alert-error">{{ error() }}</div>
    }

    <div class="field">
      <label>Title *</label>
      <input type="text" formControlName="title" placeholder="e.g. GitHub" />
    </div>

    <div class="field">
      <label>Username / Email *</label>
      <input type="text" formControlName="username" placeholder="you@example.com" autocomplete="off" />
    </div>

    <div class="field">
      <label>Password *</label>
      <div class="input-group">
        <input
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="new-password"
        />
        <button type="button" class="icon-btn" (click)="showPassword.set(!showPassword())">
          {{ showPassword() ? '🙈' : '👁️' }}
        </button>
        <button type="button" class="btn-generate" (click)="generatePassword()" title="Generate">
          ⚡
        </button>
      </div>
    </div>

    <div class="field">
      <label>URL</label>
      <input type="url" formControlName="url" placeholder="https://…" />
    </div>

    <div class="field">
      <label>Category</label>
      <input type="text" formControlName="category" placeholder="e.g. Work, Social…" />
    </div>

    <div class="field">
      <label>Notes</label>
      <textarea formControlName="notes" rows="3" placeholder="Optional notes…"></textarea>
    </div>

    <div class="field-check">
      <input id="fav" type="checkbox" formControlName="isFavorite" />
      <label for="fav">Mark as favorite</label>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn-cancel" (click)="cancelled.emit()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="loading()">
        {{ loading() ? 'Saving…' : (isEdit ? 'Save changes' : 'Add password') }}
      </button>
    </div>
  </form>
</div>
